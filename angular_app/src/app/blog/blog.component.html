<h1>My Blog</h1>

<p>Post count: {{ posts.length }}</p>

<div *ngFor="let post of posts">
  <h2>{{ post.pheading }}</h2>
  <h3>{{ post.psubheading }}</h3>
  <p>Author: {{ post.pauthor }}</p>
</div>
