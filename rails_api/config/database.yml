default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: 127.0.0.1
  port: 3306
  username: root
  password: <%= ENV.fetch("MARIADB_PASSWORD") %>

development:
  <<: *default
  database: my_blog_development

test:
  <<: *default
  database: my_blog_test

production:
  <<: *default
  database: my_blog_production